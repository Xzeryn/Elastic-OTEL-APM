# =============================================================================
# NGINX CONFIGURATION FOR PROCUREMENT FRONTEND
# =============================================================================
# Serves React static files and proxies API requests to backend services.
# Forwards W3C Trace Context headers for distributed tracing.
# =============================================================================

# Global cap on browser telemetry so the public /otlp/ path can't flood Elastic ingest.
# Keyed on server name because every request arrives via the ingress controller's IP.
limit_req_zone $server_name zone=otlp_ingest:1m rate=50r/s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Increase max body size for document uploads
    client_max_body_size 10M;

    # Serve React static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the current hashed bundle, so browsers must revalidate it
    # on every load or they keep running the previous release after a deploy.
    # SPA routes reach this block through the try_files fallback above.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Build output under /static/ has content hashes in its filenames.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ==========================================================================
    # API PROXY TO PROCUREMENT API (Node.js)
    # ==========================================================================
    # All /api/* requests are forwarded to the procurement-api service.
    # Trace context headers are forwarded for distributed tracing.
    # ==========================================================================
    location /api/ {
        proxy_pass http://procurement-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward W3C Trace Context headers for distributed tracing
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        
        # Timeouts for longer operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==========================================================================
    # BROWSER TELEMETRY (EDOT Browser -> EDOT Collector -> Elastic)
    # ==========================================================================
    # The browser posts OTLP/HTTP to /otlp/v1/{traces,metrics,logs} on this same
    # origin, so no CORS is needed. The collector holds the Elastic API key.
    # ==========================================================================
    location /otlp/ {
        limit_req zone=otlp_ingest burst=200 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        # Keep typical OTLP batches in memory instead of spooling them to disk
        client_body_buffer_size 128k;

        proxy_pass http://opentelemetry-kube-stack-daemon-collector.opentelemetry-operator-system.svc.cluster.local:4318/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check endpoint
    location /health {
        return 200 'healthy';
        add_header Content-Type text/plain;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
}
